name: Collect data

# Refreshes public/data (elections, calendars, news feeds) every hour
# and commits the result, so the site always serves fresh files.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run collectors
        run: node scripts/collect/index.mjs
        continue-on-error: true
      - name: Commit changes
        run: |
          git config user.name "observer-bot"
          git config user.email "observer-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
